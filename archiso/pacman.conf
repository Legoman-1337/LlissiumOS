#
# pacman.conf — для сборки mkarchiso и для live/target систем LlissiumOS.
# Включён репозиторий multilib — обязателен для Steam, Wine и 32-битных игр.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
Color
ILoveCandy
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Локальный мини-репозиторий для Calamares и ckbcomp (в официальных
# репозиториях Arch их нет). Путь подставляется скриптами сборки вместо
# __LOCAL_REPO__ (см. tools/fetch-manjaro-calamares.sh). В live/установленную
# систему не попадает — для них этот файл не используется.
[llissium-local]
Server = file://__LOCAL_REPO__
SigLevel = Optional TrustAll
