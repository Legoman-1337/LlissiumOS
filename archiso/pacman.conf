#
# pacman.conf — для сборки mkarchiso и для live/target систем LlissiumOS.
# Включён репозиторий multilib — обязателен для Steam, Wine и 32-битных игр.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
Color
ILoveCandy
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Резервный источник: Calamares и ckbcomp отсутствуют в официальных
# репозиториях Arch, но собираются Manjaro. Секция ниже официальных,
# поэтому используется только для пакетов, которых в core/extra нет.
[manjaro-extra]
Server = https://mirror.alpix.eu/manjaro/stable/extra/x86_64/
SigLevel = Optional TrustAll
