# kitty — LlissiumOS "Neon Eclipse" тема
# фон #08040C, пурпур #C026D3, янтарь #F59E0B

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

window_padding_width    10
background_opacity      0.92
enable_audio_bell       no
confirm_os_window_close 0
scrollback_lines        10000
url_style               curly
detect_urls             yes

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #08040C
active_tab_background   #C026D3
inactive_tab_foreground #B9A8CC
inactive_tab_background #140A1E

cursor                  #F59E0B
cursor_text_color       #08040C
cursor_shape            beam

foreground            #E6D9F2
background            #08040C
selection_foreground  #08040C
selection_background  #C026D3

# чёрный / красный / зелёный / жёлтый
color0  #1A1122
color8  #3A2A4A
color1  #FF4B77
color9  #FF7A9C
color2  #59F2C4
color10 #8CF9DC
color3  #F59E0B
color11 #FBC35D
# синий / пурпурный / циан / белый
color4  #9D6BFF
color12 #C0A6FF
color5  #C026D3
color13 #E36BF5
color6  #4BE0E0
color14 #93F0F0
color7  #D9CCEF
color15 #F5EEFB

url_color #C026D3
