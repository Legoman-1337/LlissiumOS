# Очистка live-артефактов из устанавливаемой системы.
# Выполняется в chroot целевой системы сразу после unpackfs.
dontChroot: false
timeout: 180
script:
    - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "-rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - "-rm -f /etc/systemd/system/multi-user.target.wants/etc-pacman.d-gnupg.mount"
    - "-rm -f /etc/xdg/autostart/llissium-calamares.desktop"
    - "-rm -f /etc/sddm.conf.d/llissium.conf"
    - "-rm -f /etc/sudoers.d/liveuser"
    - "-rm -f /etc/polkit-1/rules.d/49-llissium.rules"
    - "-userdel -f -r liveuser"
