# Разметка диска: EFI-системный раздел + корень (по умолчанию ext4)
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: "1GB"
efiSystemPartitionName: "EFI"

defaultFileSystemType: "ext4"

availableFileSystemTypes:
    - "ext4"
    - "btrfs"
    - "xfs"

initialPartitioningChoices: none
allowManualPartitioning: true

# LUKS-шифрование доступно на выбор пользователя
luksFileSystemType:
    - "luks2"
