# Пользователь системы: zsh по умолчанию, группы для гейминга и разработки
defaultGroups:
    - users
    - wheel
    - storage
    - video
    - audio
    - network
    - games
    - input

autologinGroup:  autologin
doAutologin:     false

sudoersGroup:    wheel
setRootPassword: true
doReusePassword: false

availableShells: /bin/bash, /bin/zsh
userShell:       /bin/zsh

allowWeakPasswords: false
