name: Build LlissiumOS ISO

on:
  push:
    branches: [ main, master ]
    paths:
      - "archiso/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "archiso/**"
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # git нужен actions/checkout внутри контейнера
      - name: Установить archiso и git
        run: pacman -Syu --noconfirm archiso git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать ISO
        run: |
          set -o pipefail
          mkarchiso -v -C archiso/pacman.conf -w work -o out archiso/ 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: При падении — выложить хвост лога в Issue (для отладки)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -S --noconfirm github-cli
          tail -n 80 build.log > error-tail.txt || echo "build.log не создан" > error-tail.txt
          {
            echo "Автосборка упала: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
            cat error-tail.txt
            echo '```'
          } > issue-body.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Build failed (run $GITHUB_RUN_ID)" \
            --body-file issue-body.md || true

      - name: Упорядочить артефакты
        run: |
          mkdir -p release
          cp out/*.iso release/
          sha256sum out/*.iso > release/SHA256SUMS

      - name: Загрузить артефакт ISO
        uses: actions/upload-artifact@v4
        with:
          name: llissiumos-iso
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Приложить ISO к Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pacman -S --noconfirm github-cli
          for f in release/*; do
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done
